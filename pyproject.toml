[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-ai"
version = "0.1.0"
description = "Cross-project code intelligence assistant"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Gabriel", email = "your-email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0", 
    "langchain-text-splitters>=0.0.1",
    "inquirer>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "anthropic>=0.3.0",
    "pathspec>=0.11.0",
    "tiktoken>=0.5.0",
    "pyperclip>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "flake8-pyproject>=1.2.0",
    "mypy>=1.0.0",
    "isort>=5.0.0",
    "autoflake>=2.0.0",
    "build>=0.10.0",
]

[project.scripts]
# Entry point mapeia raiz para src/, então cli:main aponta para src/cli.py:main
context-ai = "cli:main"

[project.urls]
Homepage = "https://github.com/gabemule/context-ai"
Repository = "https://github.com/gabemule/context-ai"
Issues = "https://github.com/gabemule/context-ai/issues"

# Configuração setuptools: mapeia raiz do pacote para pasta src/
[tool.setuptools]
package-dir = {"" = "src"}  # Raiz do pacote Python = pasta src/

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
# E203: whitespace before ':' (conflicts with Black)
# W503: line break before binary operator (Black prefers this style)
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
